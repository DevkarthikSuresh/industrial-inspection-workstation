name: Offline validation

on:
  push:
  pull_request:

jobs:
  mock-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless python-dotenv
      - name: Compile modules
        run: python -m compileall -q app.py main.py check_setup.py industrial_inspection tests
      - name: Run deterministic smoke tests
        run: python tests/run_mock_tests.py
